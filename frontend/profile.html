
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildTrack - Profile & Settings</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <h2>BuildTrack</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="stock-alerts.html">Stock Alerts</a>
            <a href="projects.html">Projects</a>
            <a href="tasks.html">Tasks</a>
            <a href="material-allocation.html">Material Allocation</a>
            <a href="suppliers.html">Suppliers</a>
            <a href="reports.html">Reports</a>
            <a href="user-management.html">User Management</a>
            <a href="profile.html" class="active">Profile & Settings</a>
            <a href="index.html">Logout</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h1>Profile & Settings</h1>
            <p>Manage your personal information and account preferences</p>
        </header>

        <section class="profile-section">

            <div class="profile-card">
                <h2>Personal Information</h2>

                <form id="profileForm">

                    <label>Full Name</label>
                    <input type="text" id="profileName"
                        value="Admin User" required>

                    <label>Email Address</label>
                    <input type="email" id="profileEmail"
                        value="admin@buildtrack.com" required>

                    <label>Phone Number</label>
                    <input type="tel" id="profilePhone"
                        value="0240000001" required>

                    <label>Role</label>
                    <input type="text" value="Administrator" disabled>

                    <button type="submit">Save Changes</button>

                </form>
            </div>

            <div class="profile-card">
                <h2>Change Password</h2>

                <form id="passwordForm">

                    <label>Current Password</label>
                    <input type="password" id="currentPassword" required>

                    <label>New Password</label>
                    <input type="password" id="newPassword" required>

                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" required>

                    <button type="submit">Update Password</button>

                </form>
            </div>

            <div class="profile-card">
                <h2>Account Preferences</h2>

                <label>
                    <input type="checkbox" id="emailNotifications" checked>
                    Enable email notifications
                </label>

                <label>
                    <input type="checkbox" id="stockNotifications" checked>
                    Enable stock alerts
                </label>

                <label>
                    <input type="checkbox" id="taskNotifications" checked>
                    Enable task notifications
                </label>

                <button type="button" id="savePreferences">
                    Save Preferences
                </button>
            </div>

        </section>

    </main>
</div>

<script src="js/profile.js"></script>
</body>
</html>
